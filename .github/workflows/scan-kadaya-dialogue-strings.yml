name: Scan Kadaya runtime dialogue and ability strings

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/run-dialogue-scan.txt"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout extracted Android assets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Scan runtime metadata and serialized text fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, struct
          import UnityPy

          root = Path.cwd()
          data_dir = root / "assets/bin/Data"
          metadata = data_dir / "Managed/Metadata/global-metadata.dat"
          if not data_dir.exists() or not metadata.exists():
              raise SystemExit("Expected extracted Unity data and global-metadata.dat.")

          report = [
              "# Kadaya runtime dialogue / ability string scan",
              "",
              "Read-only analysis. No game files were modified.",
              "",
              f"- global-metadata.dat size: {metadata.stat().st_size:,} bytes",
          ]
          raw = metadata.read_bytes()
          if len(raw) >= 8:
              magic, version = struct.unpack_from("<II", raw, 0)
              report += [f"- IL2CPP metadata magic: 0x{magic:08X}", f"- IL2CPP metadata version: {version}"]

          # Extract visible UTF-8/ASCII strings from metadata and both native libraries.
          candidates = {}
          for path in [metadata, root / "lib/arm64-v8a/libil2cpp.so", root / "lib/armeabi-v7a/libil2cpp.so"]:
              if not path.exists():
                  continue
              blob = path.read_bytes()
              vals = re.findall(rb"[\x20-\x7e]{5,}", blob)
              decoded = []
              for b in vals:
                  s = b.decode("ascii", errors="ignore").strip()
                  if not s:
                      continue
                  if re.search(r"arashi|ninja|story|dialog|talk|speech|text|skill|ability|weapon|sword|shuriken|kunai|dash|shadow|attack|friend|enemy|village|boss|tutorial|unlock|upgrade|gameover|continue|continue|\bplay\b|\bstart\b|\blevel\b|raizen|krayoo|kadaya", s, re.I):
                      decoded.append(s)
              candidates[path.name] = list(dict.fromkeys(decoded))[:1500]
              report += ["", f"## Matching native strings: {path.name} ({len(candidates[path.name])})"]
              report += [f"- {s[:220]}" for s in candidates[path.name][:500]] or ["- No likely gameplay/story strings matched."]
          
          # UnityPy reader path: find readable MonoBehaviours/TextMesh/TextAsset objects with literal text fields.
          try:
              env = UnityPy.load(str(data_dir))
              report += ["", "## Serialized object string fields"]
              text_records = []
              read_errors = 0
              for obj in env.objects:
                  kind = getattr(obj.type, "name", str(obj.type))
                  if kind not in {"MonoBehaviour", "TextMesh", "TextAsset", "TMP_FontAsset", "GameObject"}:
                      continue
                  try:
                      parsed = obj.read()
                  except Exception:
                      read_errors += 1
                      continue
                  fields = getattr(parsed, "__dict__", {})
                  if kind == "TextAsset":
                      name = str(getattr(parsed, "m_Name", "") or "")
                      script = getattr(parsed, "m_Script", b"")
                      if isinstance(script, (bytes, bytearray)):
                          val = bytes(script).decode("utf-8", errors="replace")[:1000]
                          if val.strip():
                              text_records.append((kind, name, val, int(getattr(obj, "path_id", 0))))
                  for key, value in fields.items():
                      if isinstance(value, str) and value.strip() and (key.lower() in {"m_text","text","m_name","m_string","content","dialogue","story"} or re.search(r"story|dialog|text|speak|message|ability|skill", key, re.I)):
                          if value.strip() not in {"(none)", "Text", "GameObject"}:
                              text_records.append((kind, f"{key}={value[:240]}", getattr(parsed, "m_Name", ""), int(getattr(obj,"path_id",0))))
              report += [f"- Read errors (object parser): {read_errors:,}", f"- String-like serialized fields: {len(text_records)}"]
              for kind, value, name, path_id in text_records[:1000]:
                  report.append(f"- {kind} path_id={path_id} | {value} | owner/name={str(name)[:100]}")
          except Exception as exc:
              report += ["", f"UnityPy scan failed: {type(exc).__name__}: {exc}"]

          out = Path("analysis/kadaya-runtime-dialogue-scan.md")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n".join(report) + "\n", encoding="utf-8")
          print(f"Wrote {out} ({out.stat().st_size:,} bytes)")
          PY

      - name: Commit dialogue scan report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kadaya-runtime-dialogue-scan.md
          if git diff --cached --quiet; then
            echo "No dialogue report changes."
          else
            git commit -m "Scan runtime story and ability strings"
            git push
          fi