name: Dump Kadaya IL2CPP method map in cloud

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/run-il2cpp-dump.txt"

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Download Il2CppDumper v6.7.46
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://github.com/Perfare/Il2CppDumper/releases/download/v6.7.46/Il2CppDumper-net6-v6.7.46.zip" -o "$RUNNER_TEMP/il2cppdumper.zip"
          mkdir -p "$RUNNER_TEMP/il2cppdumper"
          unzip -q "$RUNNER_TEMP/il2cppdumper.zip" -d "$RUNNER_TEMP/il2cppdumper"
          find "$RUNNER_TEMP/il2cppdumper" -maxdepth 2 -type f | head -n 30

      - name: Verify IL2CPP inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "lib/arm64-v8a/libil2cpp.so"
          test -s "assets/bin/Data/Managed/Metadata/global-metadata.dat"
          stat -c 'libil2cpp bytes: %s' lib/arm64-v8a/libil2cpp.so
          stat -c 'metadata bytes: %s' assets/bin/Data/Managed/Metadata/global-metadata.dat
          od -An -tu4 -N8 assets/bin/Data/Managed/Metadata/global-metadata.dat

      - name: Dump metadata and method offsets in cloud
        shell: bash
        run: |
          set -euo pipefail
          DUMPER="$(find "$RUNNER_TEMP/il2cppdumper" -maxdepth 2 -type f -name 'Il2CppDumper.dll' | head -n 1)"
          test -n "$DUMPER"
          mkdir -p "$RUNNER_TEMP/kadaya-il2cpp-out"
          set +e
          dotnet "$DUMPER" "$GITHUB_WORKSPACE/lib/arm64-v8a/libil2cpp.so" "$GITHUB_WORKSPACE/assets/bin/Data/Managed/Metadata/global-metadata.dat" "$RUNNER_TEMP/kadaya-il2cpp-out" > "$RUNNER_TEMP/il2cppdumper.log" 2>&1
          RC=$?
          set -e
          echo "$RC" > "$RUNNER_TEMP/il2cppdumper.exitcode"
          echo "Il2CppDumper exit code: $RC"
          tail -n 100 "$RUNNER_TEMP/il2cppdumper.log"
          find "$RUNNER_TEMP/kadaya-il2cpp-out" -maxdepth 3 -type f -printf '%p %s bytes\n' | head -n 100

      - name: Extract gameplay classes and native method offsets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, json, os

          tmp=Path(os.environ["RUNNER_TEMP"])
          outdir=tmp/"kadaya-il2cpp-out"
          report=[
            "# Kadaya IL2CPP gameplay method map","",
            "Generated in GitHub Actions cloud from Android libil2cpp.so and global-metadata.dat.",
            "This is analysis only. It does not edit the APK or any scene/map/level layout.",
            "Dumper exit code: "+(tmp/"il2cppdumper.exitcode").read_text().strip(),""
          ]
          log=tmp/"il2cppdumper.log"
          if log.exists():
              loglines=log.read_text(errors="replace").splitlines()
              report += ["## Dumper summary"]+loglines[-28:]

          dumps=list(outdir.rglob("dump.cs"))
          terms=re.compile(r"arashi|player|cailo|skill|dash|hide|disguise|attack|weapon|sword|shuriken|kunai|boss|enemy|game.?manager|level|story|shop|item|gold|coin|artifact|health|hud|audio.?player|cottruyen|leader|checkpoint|ability|move|control|damage|hit|throw|jump|roll",re.I)
          class_header=re.compile(r"^\s*(?:(?:public|internal|private|protected)\s+)?(?:(?:abstract|sealed|static|partial|readonly|unsafe|new)\s+)*(class|struct|interface|enum)\s+([A-Za-z_][\w.+<>?,\[\]]*).*?TypeDefIndex:\s*(\d+)",re.I)
          target_classes=[]
          for dump in dumps:
              lines=dump.read_text(errors="replace").splitlines()
              current_namespace=""
              headers=[]
              for idx,line in enumerate(lines):
                  ns=re.match(r"^\s*// Namespace:\s*(.*)$",line)
                  if ns:
                      current_namespace=ns.group(1).strip()
                  m=class_header.match(line)
                  if m:
                      headers.append({"line":idx,"line_no":idx+1,"kind":m.group(1),"name":m.group(2),
                                      "type_index":int(m.group(3)),"namespace":current_namespace,"dump":dump.name})
              for k,rec in enumerate(headers):
                  finish=headers[k+1]["line"] if k+1<len(headers) else len(lines)
                  rec["block"]=lines[rec["line"]:finish]
                  if rec["type_index"]>=3000 and terms.search(rec["name"]+" "+rec["namespace"]):
                      target_classes.append(rec)

          report += ["","## Game-specific class catalog (TypeDefIndex 3000+)",f"- Classes matching gameplay/name terms: {len(target_classes)}"]
          for rec in target_classes[:600]:
              report.append(f"- {rec['namespace'] or '(global namespace)'}.{rec['name']} — TypeDefIndex {rec['type_index']} — dump.cs line {rec['line_no']}")

          report += ["","## Fields and native method offsets for likely gameplay classes"]
          for rec in target_classes[:220]:
              fields=[]
              methods=[]
              block=rec["block"]
              for i,line in enumerate(block):
                  stripped=line.strip()
                  if "// RVA:" in stripped:
                      signature=""
                      for nextline in block[i+1:i+7]:
                          st=nextline.strip()
                          if st and not st.startswith("//") and not st.startswith("["):
                              signature=st
                              break
                      methods.append((stripped,signature))
                  elif "// 0x" in stripped and (";" in stripped or "{" in stripped) and not stripped.startswith("// RVA:"):
                      if len(fields)<120:
                          fields.append(stripped)
              if not fields and not methods:
                  continue
              report += ["",f"### {rec['name']} (TypeDefIndex {rec['type_index']})"]
              report.append(f"Namespace: {rec['namespace'] or '(global)'}; dump.cs line {rec['line_no']}")
              if fields:
                  report.append("Fields:")
                  report += ["- "+x for x in fields[:24]]
              if methods:
                  report.append("Methods (native RVA / file offset and signature):")
                  for rva,sig in methods[:70]:
                      report.append("- "+rva+" | "+sig)
          if not target_classes:
              report.append("- No matching game-specific classes found in dump.cs.")

          report += ["","## Exact method names from script.json"]
          scripts=list(outdir.rglob("script.json"))
          json_hits=[]
          for path in scripts[:3]:
              try:
                  data=json.loads(path.read_text(errors="replace"))
              except Exception as exc:
                  report.append(f"- Could not parse {path.name}: {exc}")
                  continue
              methods=data.get("ScriptMethod",[]) if isinstance(data,dict) else []
              for m in methods:
                  if not isinstance(m,dict): continue
                  name=str(m.get("Name",""))
                  sig=str(m.get("Signature",""))
                  if terms.search(name) or re.search(r"PlayerDash|DisguiseManager|HideObj|SkillButton|SkillTree|CotTruyenLeader|StoryCanvas|ShopPanel|LevelLeader",sig,re.I):
                      json_hits.append((name,sig))
          report.append(f"- Matching script methods: {len(json_hits)}")
          report += [f"- {name}: {sig}" for name,sig in json_hits[:600]]
          report += [
            "","## Next-step limits",
            "- Il2CppDumper recovered the method map and offsets (metadata version 31), but it does not restore original C# method bodies.",
            "- The listed RVA/file offsets identify native ARM64 code locations for a next reverse-engineering pass; offsets alone are not a safe gameplay patch.",
            "- The original playable scene files, transforms, colliders, maps and level layouts remain unchanged."
          ]
          target=Path("analysis/kadaya-il2cpp-method-map.md")
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text("\n".join(report)+"\n",encoding="utf-8")
          print(f"Report written: {target} ({target.stat().st_size:,} bytes)")
          print("\n".join(report[:180]))
          PY

      - name: Commit the compact method map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/kadaya-il2cpp-method-map.md
          if git diff --cached --quiet; then
            echo "Method map unchanged."
          else
            git commit -m "Add Kadaya IL2CPP method map"
            git push
          fi