name: Build Kadaya visual reskin patch in cloud

on:
  workflow_dispatch:
  push:
    paths:
      - "analysis/run-kadaya-reskin-preview.txt"

permissions:
  contents: read

jobs:
  reskin:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout game files
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install asset, image and Sinhala-font tools
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet UnityPy Pillow numpy
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core >/dev/null

      - name: Patch only player/weapon effect atlases, title and app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import numpy as np
          import UnityPy, shutil, json, hashlib, re, os, struct, math

          source_data = Path("assets/bin/Data")
          original_bundle = source_data / "data.unity3d"
          if not original_bundle.is_file():
              raise SystemExit("Original assets/bin/Data/data.unity3d not found.")

          work_data = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "kadaya-data-work"
          patched_data = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "kadaya-patched-data"
          validation_data = Path(os.environ.get("RUNNER_TEMP", "/tmp")) / "kadaya-validation-data"
          output = Path("kadaya-reskin-output")
          preview = output / "preview"
          icons_out = output / "icons"
          for p in (work_data, patched_data, validation_data, preview, icons_out):
              if p.exists():
                  shutil.rmtree(p)
              p.mkdir(parents=True, exist_ok=True)

          # Keep the resource sidecars beside the bundle so streamed Texture2D images resolve.
          shutil.copy2(original_bundle, work_data / "data.unity3d")
          for src in source_data.rglob("*"):
              if src.is_file() and src.name != "data.unity3d":
                  dest = work_data / src.relative_to(source_data)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(src, dest)

          def file_hash(img):
              return hashlib.sha256(img.convert("RGBA").tobytes()).hexdigest()

          def colorize_ninja_atlas(image):
              arr = np.array(image.convert("RGBA"), dtype=np.uint8)
              rgb = arr[:, :, :3].astype(np.float32)
              alpha = arr[:, :, 3]
              r, g, b = rgb[:, :, 0], rgb[:, :, 1], rgb[:, :, 2]
              lum = 0.2126*r + 0.7152*g + 0.0722*b
              cool = (b > r*1.10) & (b > 55) & (alpha > 0)
              dark = (lum < 55) & (alpha > 0)
              bright = (lum > 155) & (alpha > 0)

              # Turn the original cyan/blue combat trails into crimson shadow-energy.
              rgb[cool, 0] = np.clip(lum[cool]*0.96 + 20, 0, 255)
              rgb[cool, 1] = np.clip(lum[cool]*0.14 + 3, 0, 255)
              rgb[cool, 2] = np.clip(lum[cool]*0.19 + 5, 0, 255)

              # Tint nearly-black cloth/limbs toward ash-black with a subtle blood-red undertone.
              rgb[dark, 0] = np.clip(r[dark]*0.70 + lum[dark]*0.28 + 10, 0, 255)
              rgb[dark, 1] = np.clip(g[dark]*0.24 + 2, 0, 255)
              rgb[dark, 2] = np.clip(b[dark]*0.30 + 4, 0, 255)

              # Keep bright edges readable as cold ash/silver rather than making the atlas muddy.
              rgb[bright, 0] = np.clip(lum[bright]*0.94 + 10, 0, 255)
              rgb[bright, 1] = np.clip(lum[bright]*0.87 + 7, 0, 255)
              rgb[bright, 2] = np.clip(lum[bright]*0.88 + 8, 0, 255)
              arr[:, :, :3] = np.clip(rgb, 0, 255).astype(np.uint8)
              return Image.fromarray(arr, "RGBA")

          def recolor_ui_blue_to_crimson(image):
              arr = np.array(image.convert("RGBA"), dtype=np.uint8)
              rgb = arr[:, :, :3].astype(np.float32)
              alpha = arr[:, :, 3]
              r, g, b = rgb[:, :, 0], rgb[:, :, 1], rgb[:, :, 2]
              lum = 0.2126*r + 0.7152*g + 0.0722*b
              mask = (b > r*1.10) & (b > 65) & (alpha > 5)
              rgb[mask, 0] = np.clip(lum[mask]*0.72 + 15, 0, 255)
              rgb[mask, 1] = np.clip(lum[mask]*0.13 + 3, 0, 255)
              rgb[mask, 2] = np.clip(lum[mask]*0.17 + 6, 0, 255)
              highlight = mask & (lum > 185)
              rgb[highlight, 0] = np.clip(lum[highlight]*0.97 + 10, 0, 255)
              rgb[highlight, 1] = np.clip(lum[highlight]*0.82 + 8, 0, 255)
              rgb[highlight, 2] = np.clip(lum[highlight]*0.83 + 9, 0, 255)
              arr[:, :, :3] = np.clip(rgb, 0, 255).astype(np.uint8)
              return Image.fromarray(arr, "RGBA")

          def reskin_character_art(image):
              arr = np.array(image.convert("RGBA"), dtype=np.uint8)
              rgb = arr[:, :, :3].astype(np.float32)
              alpha = arr[:, :, 3]
              # This artwork has a flat blue-grey studio background. Replace that background
              # with a black-crimson fog while leaving the character silhouette in place.
              sample = arr[240:700, 20:180, :3].reshape(-1, 3)
              bg = np.median(sample, axis=0)
              distance = np.sqrt(((rgb - bg) ** 2).sum(axis=2))
              bg_mask = (distance < 24) & (alpha > 0)
              h, w = alpha.shape
              yy, xx = np.mgrid[0:h, 0:w]
              glow = np.exp(-(((xx-w*0.47)/(w*0.28))**2 + ((yy-h*0.56)/(h*0.33))**2))
              redfog = np.zeros_like(rgb)
              redfog[:, :, 0] = 5 + glow*35
              redfog[:, :, 1] = 4 + glow*3
              redfog[:, :, 2] = 10 + glow*11
              rgb[bg_mask] = redfog[bg_mask]

              fg = (~bg_mask) & (alpha > 0)
              r, g, b = rgb[:, :, 0].copy(), rgb[:, :, 1].copy(), rgb[:, :, 2].copy()
              lum = 0.2126*r + 0.7152*g + 0.0722*b
              cool = fg & (b > r*1.10) & (b > g*1.04)
              rgb[cool, 0] = np.clip(lum[cool]*0.97 + 14, 0, 255)
              rgb[cool, 1] = np.clip(lum[cool]*0.18 + 3, 0, 255)
              rgb[cool, 2] = np.clip(lum[cool]*0.22 + 5, 0, 255)
              dark = fg & (lum < 75)
              rgb[dark, 0] = np.clip(r[dark]*0.78 + 10, 0, 255)
              rgb[dark, 1] = np.clip(g[dark]*0.30 + 1, 0, 255)
              rgb[dark, 2] = np.clip(b[dark]*0.35 + 4, 0, 255)
              bright = fg & (lum > 155)
              rgb[bright, 0] = np.clip(lum[bright]*0.95 + 8, 0, 255)
              rgb[bright, 1] = np.clip(lum[bright]*0.82 + 8, 0, 255)
              rgb[bright, 2] = np.clip(lum[bright]*0.84 + 10, 0, 255)
              arr[:, :, :3] = np.clip(rgb, 0, 255).astype(np.uint8)
              return Image.fromarray(arr, "RGBA")

          def add_kadaya_title(image):
              img = image.convert("RGBA").copy()
              w, h = img.size
              # Fully cover the original "ARASHI II" lettering; it must not ghost through the Kadaya logo.
              panel = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              panel_draw = ImageDraw.Draw(panel)
              panel_box = (65, 48, min(770, w-22), min(465, h-20))
              panel_draw.rounded_rectangle(
                  panel_box, radius=42, fill=(4, 4, 10, 255),
                  outline=(135, 13, 34, 255), width=max(3, w//500)
              )
              panel_draw.line((105, min(425, h-40), min(720, w-45), min(425, h-40)),
                              fill=(125, 17, 38, 255), width=max(2, w//650))
              img = Image.alpha_composite(img, panel)
              draw = ImageDraw.Draw(img)
              font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSerifCondensed-Bold.ttf"
              small_path = "/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"
              try:
                  font_big = ImageFont.truetype(font_path, max(72, int(w*0.057)))
                  font_mid = ImageFont.truetype(small_path, max(28, int(w*0.022)))
                  font_low = ImageFont.truetype(font_path, max(45, int(w*0.038)))
              except OSError:
                  font_big = ImageFont.load_default()
                  font_mid = ImageFont.load_default()
                  font_low = ImageFont.load_default()

              # Crimson shadow offsets give the title contrast over the smoky background.
              title_xy = (145, 106)
              draw.text((title_xy[0]+5,title_xy[1]+6), "KADAYA", font=font_big, fill=(110, 8, 27, 220), stroke_width=2, stroke_fill=(110,8,27,220))
              draw.text(title_xy, "KADAYA", font=font_big, fill=(239, 231, 222, 255), stroke_width=1, stroke_fill=(25, 8, 14, 240))
              draw.line((155, 247, 680, 247), fill=(176, 27, 47, 245), width=max(4, w//420))
              draw.text((166, 263), "THE AGE OF", font=font_mid, fill=(216, 207, 204, 255), stroke_width=1, stroke_fill=(10,6,12,220))
              draw.text((158, 306), "SHADOWS", font=font_low, fill=(190, 31, 51, 255), stroke_width=2, stroke_fill=(12,5,10,235))
              draw.line((165, 397, 600, 397), fill=(222, 50, 65, 230), width=max(2, w//700))
              try:
                  tagline_font = ImageFont.truetype(small_path, max(12, int(w*0.008)))
              except OSError:
                  tagline_font = ImageFont.load_default()
              draw.text((165, 407), "RAIZEN TOOK KRAYOO. THE HUNT BEGINS.",
                        font=tagline_font, fill=(230, 213, 211, 255),
                        stroke_width=1, stroke_fill=(4, 4, 10, 255))
              return img

          def add_kadaya_loading_brand(image):
              """Overlay a clear Kadaya identity on an actual startup/loading/logo texture."""
              img = recolor_full_atlas(image).convert("RGBA")
              w, h = img.size
              if min(w, h) < 160:
                  # Tiny named splash/logo assets still need an actual visual change,
                  # otherwise post-save validation correctly flags them as untouched.
                  img = Image.new("RGBA", (w, h), (5, 4, 10, 255))
                  draw = ImageDraw.Draw(img)
                  draw.rectangle((1, 1, w-2, h-2), outline=(170, 20, 43, 255), width=max(1, min(w,h)//32))
                  try:
                      tiny_font = ImageFont.truetype(
                          "/usr/share/fonts/truetype/dejavu/DejaVuSerifCondensed-Bold.ttf",
                          max(12, int(min(w,h)*0.55))
                      )
                  except OSError:
                      tiny_font = ImageFont.load_default()
                  box = draw.textbbox((0,0), "K", font=tiny_font, stroke_width=1)
                  tx = (w-(box[2]-box[0]))//2
                  ty = (h-(box[3]-box[1]))//2-box[1]
                  draw.text((tx+1,ty+1), "K", font=tiny_font, fill=(130,10,31,255), stroke_width=1, stroke_fill=(2,2,5,255))
                  draw.text((tx,ty), "K", font=tiny_font, fill=(244,232,223,255), stroke_width=1, stroke_fill=(2,2,5,255))
                  return img
              draw = ImageDraw.Draw(img)
              left, right = int(w*0.08), int(w*0.92)
              top, bottom = int(h*0.06), int(h*0.31)
              draw.rounded_rectangle(
                  (left, top, right, bottom), radius=max(12, min(w,h)//28),
                  fill=(4, 3, 9, 248), outline=(155, 17, 39, 255),
                  width=max(2, min(w,h)//260)
              )
              serif = "/usr/share/fonts/truetype/dejavu/DejaVuSerifCondensed-Bold.ttf"
              sans = "/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"
              try:
                  title_font = ImageFont.truetype(serif, max(18, int(min(w,h)*0.085)))
                  subtitle_font = ImageFont.truetype(sans, max(11, int(min(w,h)*0.032)))
              except OSError:
                  title_font = subtitle_font = ImageFont.load_default()
              title = "KADAYA"
              subtitle = "THE AGE OF SHADOWS"
              title_box = draw.textbbox((0,0), title, font=title_font, stroke_width=1)
              subtitle_box = draw.textbbox((0,0), subtitle, font=subtitle_font)
              title_x = (w - (title_box[2]-title_box[0])) // 2
              sub_x = (w - (subtitle_box[2]-subtitle_box[0])) // 2
              title_y = top + int((bottom-top)*0.12)
              draw.text((title_x+2, title_y+3), title, font=title_font,
                        fill=(116, 8, 28, 255), stroke_width=2, stroke_fill=(4,3,9,255))
              draw.text((title_x, title_y), title, font=title_font,
                        fill=(242, 232, 225, 255), stroke_width=1, stroke_fill=(4,3,9,255))
              line_y = top + int((bottom-top)*0.68)
              draw.line((int(w*0.28), line_y, int(w*0.72), line_y),
                        fill=(180, 22, 45, 255), width=max(2, min(w,h)//340))
              draw.text((sub_x, line_y + max(4,min(w,h)//45)), subtitle,
                        font=subtitle_font, fill=(224, 42, 60, 255),
                        stroke_width=1, stroke_fill=(4,3,9,255))
              return img

          def recolor_full_atlas(image):
              """Translate blue/cyan/green asset tones into a restrained ash-black/crimson palette."""
              arr = np.array(image.convert("RGBA"), dtype=np.uint8)
              rgb = arr[:, :, :3].astype(np.float32)
              alpha = arr[:, :, 3]
              r, g, b = rgb[:, :, 0].copy(), rgb[:, :, 1].copy(), rgb[:, :, 2].copy()
              lum = 0.2126*r + 0.7152*g + 0.0722*b
              visible = alpha > 0

              cool = visible & (b > r*1.08) & (b > 52)
              rgb[cool, 0] = np.clip(lum[cool]*0.47 + 12, 0, 255)
              rgb[cool, 1] = np.clip(lum[cool]*0.08 + 3, 0, 255)
              rgb[cool, 2] = np.clip(lum[cool]*0.13 + 6, 0, 255)

              green = visible & (g > r*1.08) & (g > 48) & (~cool)
              rgb[green, 0] = np.clip(lum[green]*0.42 + 12, 0, 255)
              rgb[green, 1] = np.clip(lum[green]*0.08 + 4, 0, 255)
              rgb[green, 2] = np.clip(lum[green]*0.11 + 7, 0, 255)

              # Dark cloth gets a subtle red undertone while highlights remain visible.
              dark = visible & (lum < 50) & (~cool) & (~green)
              rgb[dark, 0] = np.clip(r[dark]*0.65 + 8, 0, 255)
              rgb[dark, 1] = np.clip(g[dark]*0.26 + 1, 0, 255)
              rgb[dark, 2] = np.clip(b[dark]*0.32 + 4, 0, 255)

              arr[:, :, :3] = np.clip(rgb, 0, 255).astype(np.uint8)
              return Image.fromarray(arr, "RGBA")

          def add_story_narrative(image):
              """Reskin the existing story atlas and put Kadaya's opening prologue in its blank dialogue panel."""
              img = recolor_full_atlas(image).convert("RGBA")
              w, h = img.size
              # The source atlas places an empty dialogue panel in the upper 36% and
              # the existing snow/forest/burning-village storyboard art below it.
              arr = np.array(img, dtype=np.uint8)
              rgb = arr[:, :, :3].astype(np.float32)
              alpha = arr[:, :, 3]
              yy = np.arange(h)[:, None]
              scenic = (yy >= int(h*0.30)) & (alpha > 0)
              r, g, b = rgb[:, :, 0].copy(), rgb[:, :, 1].copy(), rgb[:, :, 2].copy()
              lum = 0.2126*r + 0.7152*g + 0.0722*b
              whites = scenic & (lum > 180)
              # Keep snowy highlights as cold ash-grey so the level art remains readable.
              rgb[whites, 0] = np.clip(lum[whites]*0.62 + 18, 0, 255)
              rgb[whites, 1] = np.clip(lum[whites]*0.58 + 16, 0, 255)
              rgb[whites, 2] = np.clip(lum[whites]*0.61 + 21, 0, 255)
              arr[:, :, :3] = np.clip(rgb, 0, 255).astype(np.uint8)
              img = Image.fromarray(arr, "RGBA")

              draw = ImageDraw.Draw(img)
              serif = "/usr/share/fonts/truetype/dejavu/DejaVuSerifCondensed-Bold.ttf"
              sans = "/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"
              sinhalese = "/usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf"
              try:
                  title = ImageFont.truetype(serif, max(42, int(w*0.028)))
                  section = ImageFont.truetype(sans, max(24, int(w*0.014)))
                  body = ImageFont.truetype(sans, max(22, int(w*0.015)))
                  subtitle = ImageFont.truetype(sinhalese, max(22, int(w*0.012))) if Path(sinhalese).exists() else ImageFont.truetype(sans, max(22, int(w*0.013)))
              except OSError:
                  title = section = body = subtitle = ImageFont.load_default()

              # Restrict the text to the pre-existing top dialogue card, not the playable maps.
              panel = (28, 28, min(1745, w-25), min(int(h*0.30), h-30))
              veil = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              vd = ImageDraw.Draw(veil)
              vd.rounded_rectangle(panel, radius=max(18, w//90), fill=(5, 5, 10, 142), outline=(148, 19, 39, 210), width=max(2, w//700))
              veil = veil.filter(ImageFilter.GaussianBlur(max(1, w//1800)))
              img = Image.alpha_composite(img, veil)
              draw = ImageDraw.Draw(img)

              x = int(w*0.07)
              draw.text((x+3, int(h*0.035)+3), "KADAYA | THE AGE OF SHADOWS", font=title, fill=(110, 8, 23, 255), stroke_width=1, stroke_fill=(5, 4, 8, 255))
              draw.text((x, int(h*0.032)), "KADAYA | THE AGE OF SHADOWS", font=title, fill=(245, 235, 229, 255), stroke_width=1, stroke_fill=(22, 6, 11, 245))
              draw.line((x, int(h*0.082), int(w*0.73), int(h*0.082)), fill=(207, 34, 55, 245), width=max(3, w//520))
              draw.text((x, int(h*0.094)), "THE FALL OF HOME", font=section, fill=(222, 42, 61, 255), stroke_width=1, stroke_fill=(8, 5, 9, 255))
              draw.text((x, int(h*0.128)), "Raizen's shadows came at dusk. The village burned.", font=body, fill=(238, 230, 225, 255), stroke_width=1, stroke_fill=(7, 6, 9, 240))
              draw.text((x, int(h*0.158)), "Kadaya watched his home fall — and his friend, Krayoo, was taken.", font=body, fill=(238, 230, 225, 255), stroke_width=1, stroke_fill=(7, 6, 9, 240))
              draw.text((x, int(h*0.188)), "RAIZEN: “If you want your friend back... survive.”", font=body, fill=(247, 203, 206, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              try:
                  draw.text((x+26, int(h*0.215)), "ඔයා තාම දුර්වල වැඩියි.", font=subtitle, fill=(235, 223, 221, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              except Exception:
                  draw.text((x+26, int(h*0.215)), "Oya thama durwala wadiy.", font=body, fill=(235, 223, 221, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              draw.text((x, int(h*0.241)), "KADAYA: “Krayoo... I will bring you home.”", font=body, fill=(239, 228, 225, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              try:
                  draw.text((x+26, int(h*0.268)), "ක්‍රයෝ... මම ඔයාව ආපහු ගෙදර ගේනවා.", font=subtitle, fill=(235, 223, 221, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              except Exception:
                  draw.text((x+26, int(h*0.268)), "Krayoo... mama oyawa apahu gedara genawa.", font=body, fill=(235, 223, 221, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              return img


          def add_story_memory(image):
              """Create the companion opening story card while preserving the original storyboard art below."""
              img = recolor_full_atlas(image).convert("RGBA")
              w, h = img.size
              panel_h = min(int(h*0.30), h-30)
              panel = (28, 28, min(1745, w-25), panel_h)
              veil = Image.new("RGBA", (w, h), (0, 0, 0, 0))
              vd = ImageDraw.Draw(veil)
              vd.rounded_rectangle(panel, radius=max(18, w//90), fill=(5, 5, 10, 142), outline=(148, 19, 39, 210), width=max(2, w//700))
              veil = veil.filter(ImageFilter.GaussianBlur(max(1, w//1800)))
              img = Image.alpha_composite(img, veil)
              draw = ImageDraw.Draw(img)
              serif = "/usr/share/fonts/truetype/dejavu/DejaVuSerifCondensed-Bold.ttf"
              sans = "/usr/share/fonts/truetype/dejavu/DejaVuSansCondensed-Bold.ttf"
              sinhalese = "/usr/share/fonts/truetype/noto/NotoSansSinhala-Regular.ttf"
              try:
                  title = ImageFont.truetype(serif, max(42, int(w*0.028)))
                  section = ImageFont.truetype(sans, max(24, int(w*0.014)))
                  body = ImageFont.truetype(sans, max(22, int(w*0.015)))
                  subtitle = ImageFont.truetype(sinhalese, max(22, int(w*0.012))) if Path(sinhalese).exists() else ImageFont.truetype(sans, max(22, int(w*0.013)))
              except OSError:
                  title = section = body = subtitle = ImageFont.load_default()
              x = int(w*0.07)
              draw.text((x+3, int(h*0.035)+3), "KADAYA | THE AGE OF SHADOWS", font=title, fill=(110, 8, 23, 255), stroke_width=1, stroke_fill=(5, 4, 8, 255))
              draw.text((x, int(h*0.032)), "KADAYA | THE AGE OF SHADOWS", font=title, fill=(245, 235, 229, 255), stroke_width=1, stroke_fill=(22, 6, 11, 245))
              draw.line((x, int(h*0.082), int(w*0.73), int(h*0.082)), fill=(207, 34, 55, 245), width=max(3, w//520))
              draw.text((x, int(h*0.094)), "BENEATH THE OLD TREE", font=section, fill=(222, 42, 61, 255), stroke_width=1, stroke_fill=(8, 5, 9, 255))
              draw.text((x, int(h*0.128)), "Kadaya woke beneath the old tree as ash drifted through the wind.", font=body, fill=(238, 230, 225, 255), stroke_width=1, stroke_fill=(7, 6, 9, 240))
              draw.text((x, int(h*0.158)), "The village was gone. Krayoo was gone. Only a broken hilt remained.", font=body, fill=(238, 230, 225, 255), stroke_width=1, stroke_fill=(7, 6, 9, 240))
              draw.text((x, int(h*0.188)), "KADAYA: “Raizen... I'll bring Krayoo home.”", font=body, fill=(247, 203, 206, 255), stroke_width=1, stroke_fill=(7, 6, 9, 245))
              try:
