          def preserve_case(match, replacement):
              original = match.group(0)
              if original.isupper():
                  return replacement.upper()
              if original[:1].isupper():
                  return replacement[:1].upper() + replacement[1:]
              return replacement.lower()

          def transform_ui_label(value):
              normalized = " ".join(value.split()).casefold()
              exact = ui_exact_map.get(normalized)
              if exact is not None:
                  return exact

              changed = value
              # Keep existing behavior but present it with Kadaya's dark-fantasy naming.
              replacements = [
                  (r"\byour son\b", "your friend Krayoo"),
                  (r"\barashi\b", "Kadaya"),
                  (r"\bdosu\b", "Raizen"),
                  (r"\byasha\b", "the Crimson Archer"),
                  (r"\bkanashi\b", "the Crimson Swordmaster"),
                  (r"\bkido\b", "the Dread Knight"),
                  (r"\braven\b", "the Wanderer"),
                  (r"\bdisguise\b", "Shadow Veil"),
                  (r"\bshuriken\b", "Shadow Kunai"),
                  (r"\bdodge roll\b", "Shadow Roll"),
                  (r"\bdash\b", "Shadow Dash"),
                  (r"\bsword\b", "Shadow Blade"),
                  (r"\bartifacts\b", "Shadow Relics"),
                  (r"\bartifact\b", "Shadow Relic"),
              ]
              for pattern, replacement_name in replacements:
                  changed = re.sub(pattern, lambda match, replacement_name=replacement_name: preserve_case(match, replacement_name), changed, flags=re.IGNORECASE)
              changed = re.sub(r"(?i)\bKadaya is now be able to Shadow Dash through\b", "Kadaya can now Shadow Dash through", changed)
              return changed

          ui_text_changes = []
