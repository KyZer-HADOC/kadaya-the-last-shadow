          # Tune existing serialized movement fields in NinjaMovementScript.
          # Unity's stripped custom MonoBehaviour stream begins after the 32-byte base header.
          # Field offsets verified against dump.cs and multiple raw serialized objects:
          # dashSpeed=80, dashTime=92, JumpForce=124.
          # This modifies existing values only; it creates no new methods or abilities.
          dash_tuning_changes = []
          dash_tuning_expected = {}
          jump_tuning_changes = []
          jump_tuning_expected = {}
          player_components_seen = 0
          player_components_skipped = 0
          for obj in env.objects:
              if getattr(obj.type, "name", "") != "MonoBehaviour":
                  continue
              try:
                  header = obj.read(check_read=False)
                  script_ref = getattr(header, "m_Script", None)
                  if script_ref is None:
                      continue
                  script_data = script_ref.read()
                  if str(getattr(script_data, "m_ClassName", "") or "") != "NinjaMovementScript":
                      continue

                  player_components_seen += 1
                  raw = obj.get_raw_data()
                  if len(raw) < 128:
                      player_components_skipped += 1
                      continue

                  old_speed = struct.unpack_from("<f", raw, 80)[0]
                  old_duration = struct.unpack_from("<f", raw, 92)[0]
                  old_jump_force = struct.unpack_from("<f", raw, 124)[0]
                  # Require each value to fall in known, sensible ranges before patching.
                  if (not math.isfinite(old_speed) or not math.isfinite(old_duration)
                      or not math.isfinite(old_jump_force)
                      or not (15.0 <= old_speed <= 60.0)
                      or not (0.15 <= old_duration <= 0.8)
                      or not (10.0 <= old_jump_force <= 35.0)):
                      player_components_skipped += 1
                      continue

                  new_speed = round(old_speed * 1.20, 5)
                  new_duration = round(old_duration * 1.10, 5)
                  new_jump_force = round(old_jump_force * 1.10, 5)
                  mutable = bytearray(raw)
                  struct.pack_into("<f", mutable, 80, new_speed)
                  struct.pack_into("<f", mutable, 92, new_duration)
                  struct.pack_into("<f", mutable, 124, new_jump_force)
                  obj.set_raw_data(bytes(mutable))

                  asset_file = getattr(getattr(obj, "assets_file", None), "name", "unknown")
                  path_id = int(getattr(obj, "path_id", 0))
                  key = (asset_file, path_id)
                  dash_tuning_expected[key] = {
                      "old_speed": old_speed,
                      "new_speed": new_speed,
                      "old_duration": old_duration,
                      "new_duration": new_duration,
                  }
                  dash_tuning_changes.append({
                      "file": asset_file,
                      "path_id": path_id,
                      "old_dash_speed": old_speed,
                      "new_dash_speed": new_speed,
                      "old_dash_time_seconds": old_duration,
                      "new_dash_time_seconds": new_duration,
                  })
                  jump_tuning_expected[key] = {
                      "old_jump_force": old_jump_force,
                      "new_jump_force": new_jump_force,
                  }
                  jump_tuning_changes.append({
                      "file": asset_file,
                      "path_id": path_id,
                      "old_jump_force": old_jump_force,
                      "new_jump_force": new_jump_force,
                  })
              except Exception:
                  player_components_skipped += 1
                  continue

          if len(dash_tuning_changes) < 20 or len(jump_tuning_changes) < 20:
              raise SystemExit(
                  "Movement parameter patch refused: expected at least 20 recognized player components; "
                  f"Dash tuned {len(dash_tuning_changes)}, Jump tuned {len(jump_tuning_changes)}, "
                  f"seen {player_components_seen}."
              )
          dash_summary = {
              "player_components_seen": player_components_seen,
              "player_components_tuned": len(dash_tuning_changes),
              "player_components_skipped": player_components_skipped,
              "dash_speed_multiplier": 1.20,
              "dash_duration_multiplier": 1.10,
              "details": dash_tuning_changes,
              "note": "Existing Dash is faster and lasts slightly longer. No new native ability logic is added."
          }
          jump_summary = {
              "player_components_seen": player_components_seen,
              "player_components_tuned": len(jump_tuning_changes),
              "player_components_skipped": player_components_skipped,
              "jump_force_multiplier": 1.10,
              "details": jump_tuning_changes,
              "note": "Existing jump force increased by 10%; no scene geometry or level layout was changed."
          }
          (preview / "kadaya-shadow-dash-tuning.json").write_text(
              json.dumps(dash_summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          (preview / "kadaya-shadow-leap-tuning.json").write_text(
              json.dumps(jump_summary, ensure_ascii=False, indent=2), encoding="utf-8"
          )
          print(
              f"Tuned existing movement parameters on {len(dash_tuning_changes)} "
              f"NinjaMovementScript components: Dash speed +20%, Dash duration +10%, "
              f"Jump force +10%; seen {player_components_seen}, skipped {player_components_skipped}."
          )

          # Make the bundle visible as changed so UnityPy repacks the parent container.
          marker = getattr(bundle, "mark_changed", None)
          if callable(marker):
              marker()
          patched_data.mkdir(parents=True, exist_ok=True)
          env.save(pack="lz4", out_path=str(patched_data))
          new_bundle = patched_data / "data.unity3d"
          if not new_bundle.is_file() or new_bundle.stat().st_size < 1024*1024:
              produced = [(str(p),p.stat().st_size) for p in patched_data.rglob("*") if p.is_file()]
              raise SystemExit(f"UnityPy didn't produce a plausible patched data.unity3d. Files: {produced}")

          # Validate the serialized bundle can be reopened, and that each target image changed.
          shutil.copytree(work_data, validation_data, dirs_exist_ok=True)
          shutil.copy2(new_bundle, validation_data / "data.unity3d")
          env2 = UnityPy.load(str(validation_data))
          check = {}
          for obj in env2.objects:
              if getattr(obj.type,"name","") != "Texture2D":
                  continue
              try:
                  d = obj.read()
                  key = str(getattr(d,"m_Name","") or "").lower()
                  if key in wanted and key not in check:
                      img = d.image.convert("RGBA")
                      check[key] = {"size":list(img.size),"sha256":file_hash(img)}
                      img.save(preview / (key.replace(" ","_") + "-reopened.png"))
              except Exception:
                  continue
          missing_verify = sorted(wanted - set(check))
          if missing_verify:
              raise SystemExit("Patched bundle reopened but target textures were not readable: " + ", ".join(missing_verify))
          for key in wanted:
              if check[key]["sha256"] == original_hashes[key]:
                  raise SystemExit(f"Validation failed: {key} did not change in the saved bundle.")

          # Validate the tuned existing movement fields after the Unity bundle has been saved and reopened.
          reopened_movement = {}
          for obj in env2.objects:
              if getattr(obj.type, "name", "") != "MonoBehaviour":
                  continue
              try:
                  header = obj.read(check_read=False)
                  script_ref = getattr(header, "m_Script", None)
                  if script_ref is None:
                      continue
                  script_data = script_ref.read()
                  if str(getattr(script_data, "m_ClassName", "") or "") != "NinjaMovementScript":
                      continue
                  raw = obj.get_raw_data()
                  if len(raw) < 128:
                      continue
                  key = (
                      getattr(getattr(obj, "assets_file", None), "name", "unknown"),
                      int(getattr(obj, "path_id", 0)),
                  )
                  reopened_movement[key] = {
                      "dash_speed": struct.unpack_from("<f", raw, 80)[0],
                      "dash_time": struct.unpack_from("<f", raw, 92)[0],
                      "jump_force": struct.unpack_from("<f", raw, 124)[0],
                  }
              except Exception:
                  continue

          movement_validation_failures = []
          for key, expected in dash_tuning_expected.items():
              got = reopened_movement.get(key)
              if got is None:
                  movement_validation_failures.append(f"{key}: component missing after reopen")
                  continue
              if abs(got["dash_speed"] - expected["new_speed"]) > 0.002:
                  movement_validation_failures.append(f"{key}: dash speed not preserved")
              if abs(got["dash_time"] - expected["new_duration"]) > 0.002:
                  movement_validation_failures.append(f"{key}: dash duration not preserved")
          for key, expected in jump_tuning_expected.items():
              got = reopened_movement.get(key)
              if got is None:
                  movement_validation_failures.append(f"{key}: movement component missing after reopen")
                  continue
              if abs(got["jump_force"] - expected["new_jump_force"]) > 0.002:
                  movement_validation_failures.append(f"{key}: jump force not preserved")
          if movement_validation_failures:
              raise SystemExit("Movement parameter validation failed: " + "; ".join(movement_validation_failures[:12]))
          if len(dash_tuning_expected) != len(reopened_movement.keys() & dash_tuning_expected.keys()):
              raise SystemExit("Not every tuned Dash component was found after bundle reopen.")
          if len(jump_tuning_expected) != len(reopened_movement.keys() & jump_tuning_expected.keys()):
              raise SystemExit("Not every tuned Jump component was found after bundle reopen.")
          print(
              f"Validated movement parameters after reopen: {len(dash_tuning_expected)} components; "
              f"Dash speed +20%, Dash duration +10%, Jump force +10%."
          )

          # Verify the actual serialized story/tutorial words, not just the overlaid story artwork.
          reopened_texts = []
          textmesh_read_errors = 0
          for obj in env2.objects:
              if getattr(obj.type, "name", "") != "TextMesh":
                  continue
              try:
                  reopened = obj.read()
                  value = getattr(reopened, "m_Text", None)
                  if isinstance(value, str) and value.strip():
                      reopened_texts.append(value)
              except Exception:
                  textmesh_read_errors += 1
          expected_dialogue_fragments = [
              "Find Krayoo, Kadaya.",
              "Raizen's first guard stands here",
              "KADAYA, MOVE!",
              "Raizen took Krayoo to the Shadow Fortress.",
          ]
          missing_dialogue = [
              phrase for phrase in expected_dialogue_fragments
              if not any(phrase.casefold() in text.casefold() for text in reopened_texts)
          ]
          if dialogue_changes and missing_dialogue:
              raise SystemExit("Serialized dialogue patch failed after bundle reopen: " + "; ".join(missing_dialogue))
          if len(dialogue_changes) < 8:
              raise SystemExit(f"Expected multiple in-game dialogue changes but found only {len(dialogue_changes)}.")
          print(f"Validated patched bundle size: {new_bundle.stat().st_size:,} bytes")
          print(f"Validated {len(check)} modified Texture2D assets after reopening.")
          print(f"Validated serialized dialogue: {len(dialogue_changes)} objects changed; {len(reopened_texts)} readable TextMesh values reopened; {textmesh_read_errors} read errors.")

          # Re-open and validate the modified UnityEngine.UI.Text fields from the saved bundle.
          reopened_ui_texts = []
          ui_reopen_errors = 0
          for obj in env2.objects:
              if getattr(obj.type, "name", "") != "MonoBehaviour":
                  continue
              try:
                  header = obj.read(check_read=False)
                  script_ref = getattr(header, "m_Script", None)
                  if script_ref is None:
                      continue
                  script_info = script_ref.read()
                  if str(getattr(script_info, "m_ClassName", "") or "") != "Text":
                      continue
                  raw = obj.get_raw_data()
                  if len(raw) < 152:
                      continue
                  text_length = int.from_bytes(raw[144:148], "little", signed=False)
                  if text_length < 1 or text_length > 4096 or 148 + text_length > len(raw):
                      continue
                  value = raw[148:148 + text_length].decode("utf-8")
                  reopened_ui_texts.append(value)
              except Exception:
                  ui_reopen_errors += 1
          expected_ui_fragments = [
              "SHADOW LEAP",
              "SHADOW VEIL",
              "KADAYA'S SHADOW BLADE",
              "SHADOW KUNAI",
              "Shadow Dash",
          ]
          missing_ui = [
              phrase for phrase in expected_ui_fragments
              if not any(phrase.casefold() in value.casefold() for value in reopened_ui_texts)
          ]
          if len(ui_text_changes) < 10:
              raise SystemExit(f"Expected multiple ability/menu label changes but found only {len(ui_text_changes)}.")
          if missing_ui:
              raise SystemExit("UI label patch failed after reopening: " + "; ".join(missing_ui))
          print(f"Validated UI text changes: {len(ui_text_changes)} objects changed; {len(reopened_ui_texts)} UI Text values reopened; {ui_reopen_errors} read errors.")

          # Build density-correct Android launcher icons; no APK files are modified in this step.
          icon_records = []
          for path in sorted(Path("res").rglob("app_icon*.png")):
              try:
                  with Image.open(path) as old:
                      size = old.size[0]
                      if old.size[0] != old.size[1]:
                          continue
                      icon = icon_master.resize((size,size), Image.Resampling.LANCZOS)
                      dest = icons_out / path.relative_to(Path("res"))
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      icon.save(dest, optimize=True)
                      icon_records.append({"path":str(Path("res")/path.relative_to(Path("res"))),"size":size,"bytes":dest.stat().st_size})
              except Exception:
                  continue
          if not icon_records:
              raise SystemExit("No res/**/app_icon*.png launcher icons found to replace.")

          # Export only the changed bundle and the small app-icon replacements.
          patch_bundle = output / "assets/bin/Data/data.unity3d"
          patch_bundle.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(new_bundle, patch_bundle)
          report = {
              "source_bundle_bytes": original_bundle.stat().st_size,
              "patched_bundle_bytes": new_bundle.stat().st_size,
              "unity_version": next((str(v) for v in [getattr(next(iter(env.objects),None),"assets_file",None)] if v), "see project settings"),
              "textures_patched": {key:{"source_file":found[key]["file"],"size":list(found[key]["original"].size),"original_sha256":original_hashes[key],"modified_sha256":modified_hashes[key]} for key in sorted(wanted)},
              "textures_validated_after_reopen": check,
              "serialized_dialogue_objects_changed": len(dialogue_changes),
              "serialized_dialogue_unique_rewrites": json.loads((preview / "kadaya-story-dialogue-changes.json").read_text(encoding="utf-8"))["unique_dialogue_rewrites"],
              "serialized_ui_text_objects_changed": len(ui_text_changes),
              "serialized_ui_text_unique_rewrites": json.loads((preview / "kadaya-ui-label-changes.json").read_text(encoding="utf-8"))["unique_rewrites"],
              "existing_shadow_dash_components_tuned": len(dash_tuning_changes),
              "shadow_dash_parameters": json.loads((preview / "kadaya-shadow-dash-tuning.json").read_text(encoding="utf-8")),
              "existing_shadow_leap_components_tuned": len(jump_tuning_changes),
              "shadow_leap_parameters": json.loads((preview / "kadaya-shadow-leap-tuning.json").read_text(encoding="utf-8")),
              "icons": icon_records,
              "note": "This data bundle + launcher icon patch rebrands visual/story/UI assets and tunes existing Dash (+20% speed, +10% duration) and Jump (+10% force) parameters. It does not add new native ability code. Playable scene transforms, colliders, maps and level layouts were not edited."
          }
          (output/"patch-report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          (output/"README-PATCH.txt").write_text(
              "KADAYA | THE AGE OF SHADOWS — visual reskin patch\n\n"
              "Contains a repacked Unity data.unity3d and replacements for the Android launcher app_icon.png files.\n"
              "The patch tints the player/weapon effect atlases to ash-black/crimson, rebrands the title texture, applies red-dark character artwork, and recolors blue HUD accents.\n"
              "The original Unity scenes, maps, and levels are not edited.\n\n"
              "This is not a complete APK yet. Keep a backup of the original files. Apply only to a copy of the matching game build.\n",
              encoding="utf-8")
          print(f"Exported patch bundle + {len(icon_records)} icon sizes.")
          PY

      - name: Upload validated Kadaya reskin patch
        uses: actions/upload-artifact@v4
        with:
          name: kadaya-reskin-visual-patch
          path: kadaya-reskin-output/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
