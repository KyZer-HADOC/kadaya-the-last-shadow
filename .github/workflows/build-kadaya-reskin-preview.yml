              if getattr(obj.type, "name", "") != "MonoBehaviour":
                  continue
              try:
                  basic = obj.read(check_read=False)
                  script_ref = getattr(basic, "m_Script", None)
                  if script_ref is None:
                      continue
                  script_data = script_ref.read()
                  if str(getattr(script_data, "m_ClassName", "") or "") != "Text":
                      continue

                  raw = obj.get_raw_data()
                  # For this game's stripped UnityEngine.UI.Text layout, the first text field
                  # begins at byte 148 with its UTF-8 byte length stored at bytes 144..147.
                  if len(raw) < 152:
                      ui_text_skipped += 1
                      continue
                  old_len = int.from_bytes(raw[144:148], "little", signed=False)
                  if old_len < 1 or old_len > 4096 or 148 + old_len > len(raw):
                      ui_text_skipped += 1
                      continue
                  old_bytes = raw[148:148 + old_len]
                  if b"\\x00" in old_bytes:
                      ui_text_skipped += 1
                      continue
                  try:
                      old_text = old_bytes.decode("utf-8")
                  except UnicodeDecodeError:
                      ui_text_skipped += 1
                      continue
                  ui_text_examined += 1
                  new_text = transform_ui_label(old_text)
                  if new_text == old_text:
                      continue

                  new_bytes = new_text.encode("utf-8")
                  new_raw = raw[:144] + len(new_bytes).to_bytes(4, "little") + new_bytes + raw[148 + old_len:]
                  obj.set_raw_data(new_raw)
                  ui_text_changes.append({
                      "file": getattr(getattr(obj, "assets_file", None), "name", "unknown"),
                      "path_id": int(getattr(obj, "path_id", 0)),
                      "old": old_text[:320],
                      "new": new_text[:360],
                  })
              except Exception:
